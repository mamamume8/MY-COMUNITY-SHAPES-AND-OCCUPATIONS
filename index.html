<title>My Community Games</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen playground — a sunny sky header, a big "play mat" in the middle, giant touch targets for 5-year-olds.
   Deliberately single-theme (a bright picture-book world), so every color is set explicitly. */
:root {
  --sky: #BDE7FF;
  --sky-deep: #4FB3E8;
  --sun: #FFD23F;
  --orange: #F28C28;
  --grass: #6DBB3C;
  --berry: #E0457B;
  --grape: #7B4FC9;
  --ink: #26305C;
  --paper: #FFFFFF;
  --paper-2: #FFF7E6;
  --display: "Baloo 2", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: var(--display);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.app {
  min-height: 100%;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 20px;
  background:
    radial-gradient(circle at 92% 6%, var(--sun) 0 46px, transparent 47px),
    linear-gradient(to top, #9FD86E 0 70px, transparent 70px),
    var(--sky);
  box-sizing: border-box;
}
button { font-family: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 5px solid var(--grape); outline-offset: 4px; }

/* top bar */
.bar { display: flex; align-items: center; gap: 12px; max-width: 980px; width: 100%; margin: 0 auto; min-height: 64px; }
.home-btn {
  width: 60px; height: 60px; border-radius: 20px; background: var(--paper);
  box-shadow: 0 5px 0 #8CC8EA; display: grid; place-items: center; flex: none;
}
.home-btn svg { width: 34px; height: 34px; }
.bar h1 { margin: 0; font-size: clamp(22px, 4.5vw, 34px); font-weight: 800; line-height: 1; flex: 1; min-width: 0; text-wrap: balance; }
.stars { display: flex; gap: 2px; background: var(--paper); border-radius: 999px; padding: 6px 12px; box-shadow: 0 5px 0 #8CC8EA; flex: none; }
.stars img { width: 30px; height: 30px; opacity: .22; filter: grayscale(1); transition: all .3s; }
.stars img.on { opacity: 1; filter: none; transform: scale(1.15); }

main { flex: 1; max-width: 980px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; }

/* home */
.hero { display: flex; align-items: center; gap: 16px; margin: 10px 0 18px; }
.hero img { width: clamp(80px, 16vw, 130px); flex: none; animation: bob 2.4s ease-in-out infinite; }
.bubble {
  background: var(--paper); border-radius: 28px; padding: 14px 22px; position: relative;
  box-shadow: 0 6px 0 #8CC8EA; min-width: 0;
}
.bubble::before { content: ""; position: absolute; left: -14px; top: 40%; border: 12px solid transparent; border-right: 16px solid var(--paper); border-left: 0; }
.bubble b { display: block; font-size: clamp(24px, 5vw, 40px); line-height: 1.05; }
.bubble span { font-size: 16px; font-weight: 500; opacity: .75; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
.tile {
  background: var(--paper); border-radius: 30px; padding: 16px 10px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  box-shadow: 0 8px 0 var(--edge, #8CC8EA); transition: transform .15s;
  border: 5px solid var(--ring, var(--paper));
}
.tile:hover { transform: translateY(-4px) rotate(-1deg); }
.tile:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--edge, #8CC8EA); }
.tile .pics { height: 86px; display: flex; align-items: center; justify-content: center; gap: 2px; }
.tile .pics img, .tile .pics svg { height: 74px; width: auto; }
.tile .pics svg { width: 60px; height: 60px; }
.tile strong { font-size: 24px; line-height: 1; }
.tile small { font-size: 14px; font-weight: 500; opacity: .7; text-align: center; }
.t1 { --ring: #FFE1A8; --edge: #F2B45A; }
.t2 { --ring: #CFE9FF; --edge: #7AB8E0; }
.t3 { --ring: #E5D8FA; --edge: #A88BDB; }
.t4 { --ring: #FAD3E0; --edge: #E38AAB; }
.t5 { --ring: #D7F0C6; --edge: #8CC765; }
.teacher-note { margin-top: 18px; font-size: 15px; font-weight: 500; background: rgba(255,255,255,.7); border-radius: 18px; padding: 10px 16px; line-height: 1.4; }

/* game */
.prompt { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 8px 0 14px; flex-wrap: wrap; }
.speak {
  width: 78px; height: 78px; border-radius: 50%; background: var(--orange); box-shadow: 0 6px 0 #B85F12;
  display: grid; place-items: center; flex: none; animation: pulse 1.8s ease-in-out infinite;
}
.speak svg { width: 44px; height: 44px; }
.prompt-text { background: var(--paper); border-radius: 24px; padding: 8px 22px; box-shadow: 0 5px 0 #8CC8EA; text-align: center; min-width: 0; }
.prompt-text b { display: block; font-size: clamp(24px, 5vw, 38px); line-height: 1.1; }
.prompt-text span { font-size: 15px; font-weight: 500; opacity: .7; }
.stage { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.who {
  background: var(--paper); border-radius: 30px; padding: 10px 24px; box-shadow: 0 6px 0 #8CC8EA;
  display: flex; align-items: center; gap: 10px;
}
.who img { height: clamp(90px, 18vw, 140px); }
.pattern { display: flex; gap: clamp(6px, 2vw, 16px); background: var(--paper); border-radius: 30px; padding: 14px 18px; box-shadow: 0 6px 0 #8CC8EA; flex-wrap: wrap; justify-content: center; }
.pattern svg, .slot { width: clamp(58px, 14vw, 110px); height: clamp(58px, 14vw, 110px); }
.slot { border: 5px dashed var(--orange); border-radius: 20px; display: grid; place-items: center; font-size: clamp(36px, 8vw, 64px); font-weight: 800; color: var(--orange); background: var(--paper-2); box-sizing: border-box; animation: wiggle 1.6s ease-in-out infinite; }
.choices { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: clamp(10px, 2.5vw, 22px); width: 100%; max-width: 820px; }
.choice {
  background: var(--paper); border-radius: 30px; aspect-ratio: 1 / 1; max-width: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  box-shadow: 0 8px 0 #8CC8EA; transition: transform .12s; padding: 10px; box-sizing: border-box;
}
.choice img, .choice svg { width: 72%; height: auto; max-height: 72%; object-fit: contain; pointer-events: none; }
.choice .lbl { font-size: clamp(14px, 2.6vw, 22px); font-weight: 700; line-height: 1; }
.choice:active { transform: translateY(5px); box-shadow: 0 3px 0 #8CC8EA; }
.choice.right { background: #DFF5CF; box-shadow: 0 8px 0 var(--grass); animation: pop .5s; }
.choice.wrong { animation: shake .45s; background: #FFE0E6; }

/* memory */
.memory { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 2.5vw, 18px); width: 100%; max-width: 640px; }
.card { aspect-ratio: 1 / 1; perspective: 700px; max-width: 100%; }
.card .in { position: relative; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; }
.card.open .in { transform: rotateY(180deg); }
.card .f, .card .b { position: absolute; inset: 0; border-radius: 24px; backface-visibility: hidden; display: grid; place-items: center; box-shadow: 0 7px 0 #8CC8EA; }
.card .f { background: var(--grape); background-image: radial-gradient(circle, rgba(255,255,255,.25) 3px, transparent 4px); background-size: 22px 22px; }
.card .f img { width: 52%; }
.card .b { background: var(--paper); transform: rotateY(180deg); }
.card .b img { width: 74%; }
.card.done .b { background: #DFF5CF; box-shadow: 0 7px 0 var(--grass); }

/* explore */
.explore-group { width: 100%; }
.explore-group h2 { font-size: 24px; margin: 6px 0 10px; }
.explore { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; }
.explore .choice { aspect-ratio: auto; padding: 14px 8px; }
.explore .choice img, .explore .choice svg { width: 80px; height: 80px; max-height: none; }

/* end */
.end { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.end img.big { width: clamp(120px, 28vw, 200px); animation: bob 2s ease-in-out infinite; }
.end h2 { font-size: clamp(34px, 8vw, 60px); margin: 0; line-height: 1; }
.end p { margin: 0; font-size: 18px; font-weight: 500; }
.end .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.big-btn { font-size: 26px; font-weight: 800; color: #fff; padding: 12px 30px; border-radius: 999px; background: var(--grass); box-shadow: 0 6px 0 #3F8A1E; }
.big-btn.alt { background: var(--grape); box-shadow: 0 6px 0 #4E2C8F; }

/* celebration overlay */
.cheer { position: fixed; inset: 0; pointer-events: none; display: grid; place-items: center; z-index: 20; }
.cheer img { width: 160px; animation: zoom .9s ease-out forwards; }
.confetti { position: fixed; top: -20px; width: 14px; height: 20px; border-radius: 4px; z-index: 21; pointer-events: none; animation: fall linear forwards; }

@keyframes bob { 50% { transform: translateY(-10px); } }
@keyframes pulse { 50% { transform: scale(1.08); } }
@keyframes wiggle { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
@keyframes pop { 40% { transform: scale(1.12); } }
@keyframes shake { 20%, 60% { transform: translateX(-12px); } 40%, 80% { transform: translateX(12px); } }
@keyframes zoom { 0% { transform: scale(.2); opacity: 0; } 40% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
@media (max-width: 520px) {
  .choices { grid-template-columns: repeat(min(var(--n, 3), 2), minmax(0, 1fr)); }
  .choices[style*="--n:3"] .choice:last-child { grid-column: 1 / -1; width: 50%; justify-self: center; }
}
</style>

  <div class="bar">
    <button class="home-btn" id="homeBtn" aria-label="Home" hidden>

    </button>
    <h1 id="barTitle">My Community</h1>
    <div class="stars" id="stars" aria-label="Stars"></div>
  </div>
  <main id="main"></main>
</div>

function shapeSVG(id) {
  const s = SHAPES.find((x) => x.id === id);
  const st = `fill="${s.color}" stroke="#26305C" stroke-width="5" stroke-linejoin="round"`;
  const body = {

    square: `<rect x="10" y="10" width="80" height="80" rx="8" ${st}/>`,

    rectangle: `<rect x="5" y="27" width="90" height="46" rx="8" ${st}/>`,
  }[id];
  return `<svg viewBox="0 0 100 100" aria-label="${s.word}">${body}</svg>`;
}
const pic = (id) => SHAPES.some((s) => s.id === id) ? shapeSVG(id) : `<img src="${IMG[id]}" alt="">`;
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickOthers = (pool, not, n) => shuffle(pool.filter((x) => x !== not)).slice(0, n);

/* ---------- sound ---------- */
let voice = null;
function loadVoice() {
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  voice = vs.find((v) => /en[-_]US/i.test(v.lang) && /female|samantha|google us|jenny|aria/i.test(v.name))
       || vs.find((v) => /en[-_]US/i.test(v.lang)) || vs.find((v) => /^en/i.test(v.lang)) || null;
}
if (window.speechSynthesis) { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function say(text, rate = 0.82) {
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = rate; u.pitch = 1.15;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  } catch (e) {}
}
let actx = null;
function tone(freqs, type = "sine", dur = 0.14) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      const t = actx.currentTime + i * dur;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 1.6);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur * 1.8);
    });
  } catch (e) {}
}
const ding = () => tone([660, 880, 1175], "triangle", 0.11);
const boop = () => tone([300, 220], "square", 0.16);

  $stars.setAttribute("aria-label", `${n} of ${ROUNDS} stars`);
}
function cheer() {
  const c = document.createElement("div"); c.className = "cheer"; c.innerHTML = `<img src="${IMG.party}" alt="">`;
  document.body.appendChild(c); setTimeout(() => c.remove(), 950);
  const cols = ["#E0457B", "#F28C28", "#FFD23F", "#6DBB3C", "#7B4FC9", "#4FB3E8"];
  for (let i = 0; i < 26; i++) {
    const d = document.createElement("div"); d.className = "confetti";
    d.style.left = Math.random() * 100 + "vw"; d.style.background = cols[i % cols.length];
    d.style.animationDuration = 1.2 + Math.random() * 1.2 + "s"; d.style.animationDelay = Math.random() * .3 + "s";
    document.body.appendChild(d); setTimeout(() => d.remove(), 2800);
  }
}

/* ---------- generic quiz engine ---------- */
function runQuiz({ title, makeRound }) {
  $home.hidden = false; $title.textContent = title; $stars.hidden = false;
  score = 0; drawStars();
  let round = 0;
  const next = () => {
    if (round >= ROUNDS) return showEnd(title, () => runQuiz({ title, makeRound }));
    const r = makeRound(round++);
    $main.innerHTML = `
      <div class="prompt">
        <button class="speak" id="speak" aria-label="Listen again">${speakerIcon}</button>
        <div class="prompt-text"><b>${r.prompt}</b><span>${r.es}</span></div>
      </div>
      <div class="stage">${r.top || ""}<div class="choices" style="--n:${r.options.length}">
        ${r.options.map((o) => `<button class="choice" data-id="${o.id}" aria-label="${o.word}">${pic(o.id)}${r.labels ? `<span class="lbl">${o.word}</span>` : ""}</button>`).join("")}
      </div></div>`;
    const talk = () => say(r.speak);
    document.getElementById("speak").onclick = talk;
    setTimeout(talk, 250);
    let locked = false, missed = false;
    $main.querySelectorAll(".choice").forEach((btn) => btn.onclick = () => {
      if (locked) return;
      if (btn.dataset.id === r.answer) {
        locked = true; btn.classList.add("right"); ding(); cheer();
        if (!missed) { score++; drawStars(); }
        say(`${PRAISE[Math.floor(Math.random() * PRAISE.length)]} ${r.after || ""}`);
        setTimeout(next, 2300);
      } else {
        missed = true; btn.classList.remove("wrong"); void btn.offsetWidth; btn.classList.add("wrong"); boop();
        say("Oops! Try again!");
      }
    });
  };
  next();
}

function showEnd(title, again) {
  ding(); setTimeout(cheer, 200);
  const msg = score >= 4 ? "Super explorer!" : score >= 2 ? "Good job!" : "Nice try!";
  say(`${msg} You got ${score} stars!`);
  $main.innerHTML = `
    <div class="end">
      <img class="big" src="${IMG.trophy}" alt="">
      <h2>${msg}</h2>
      <p>¡Ganaste ${score} ${score === 1 ? "estrella" : "estrellas"}!</p>
      <div class="row">
        <button class="big-btn" id="again">Play again</button>
        <button class="big-btn alt" id="home2">Home</button>
      </div>
    </div>`;
  document.getElementById("again").onclick = again;
  document.getElementById("home2").onclick = showHome;
}

const GAMES = {

    const group = (h, items, sentence) => `
      <section class="explore-group"><h2>${h}</h2><div class="explore">
        ${items.map((o) => `<button class="choice" data-say="${sentence(o)}" aria-label="${o.word}">${pic(o.id)}<span class="lbl">${o.word}</span></button>`).join("")}
      </div></section>`;
    $main.innerHTML = `
      <div class="prompt"><div class="prompt-text"><b>Touch and listen!</b><span>Toca cada imagen y repite la palabra</span></div></div>
      <div class="stage">
        ${group("Places", PLACES, (o) => `${o.word}! ${o.word}!`)}
        ${group("Helpers", HELPERS, (o) => `${o.word}! I work at the ${place(o.place).word.toLowerCase()}.`)}
        ${group("Shapes", SHAPES, (o) => `${o.word}! ${o.word}!`)}
      </div>`;
    $main.querySelectorAll("[data-say]").forEach((b) => b.onclick = () => {
      b.classList.remove("right"); void b.offsetWidth; b.classList.add("right"); say(b.dataset.say, 0.75);
    });
  },

  places() {
    const order = shuffle(PLACES).slice(0, ROUNDS);
    runQuiz({
      title: "Places",
      makeRound: (i) => {
        const ans = order[i];
        const opts = shuffle([ans, ...pickOthers(PLACES, ans, 2)]);
        return {
          prompt: `Touch the ${ans.word.toLowerCase()}!`, es: "Escucha y toca el lugar correcto",
          speak: `Where is the ${ans.word.toLowerCase()}? Touch the ${ans.word.toLowerCase()}!`,
          after: `It's the ${ans.word.toLowerCase()}!`, options: opts, answer: ans.id,
        };
      },
    });
  },

  helpers() {
    const order = shuffle([...HELPERS, ...shuffle(HELPERS)]).slice(0, ROUNDS);
    runQuiz({
      title: "Helpers",
      makeRound: (i) => {
        const h = order[i], ans = place(h.place);
        const opts = shuffle([ans, ...pickOthers(PLACES, ans, 2)]);
        return {
          top: `<div class="who"><img src="${IMG[h.id]}" alt="${h.word}"></div>`,
          prompt: `Where does the ${h.word.toLowerCase()} work?`, es: `¿Dónde trabaja ${h.es === "Bombero" ? "el bombero" : "la " + h.es.toLowerCase()}?`,
          speak: `Where does the ${h.word.toLowerCase()} work?`,
          after: `The ${h.word.toLowerCase()} works at the ${ans.word.toLowerCase()}.`,
          options: opts, answer: ans.id, labels: true,
        };
      },
    });
  },

  shapes() {
    runQuiz({
      title: "Shapes",
      makeRound: (i) => {
        if (i % 2 === 1) { // find the shape
          const ans = shuffle(SHAPES)[0];
          return {
            prompt: `Touch the ${ans.word.toLowerCase()}!`, es: `Toca el ${ans.es.toLowerCase()}`,
            speak: `Find the ${ans.word.toLowerCase()}! Touch the ${ans.word.toLowerCase()}!`,
            after: `It's a ${ans.word.toLowerCase()}!`, options: shuffle([ans, ...pickOthers(SHAPES, ans, 2)]), answer: ans.id,
          };
        }
        const [a, b] = shuffle(SHAPES);
        const seq = [a, b, a, b, a], ans = b;
        const opts = shuffle([ans, ...pickOthers(SHAPES, ans, 2)]);
        return {
          top: `<div class="pattern">${seq.slice(0, 4).map((s) => shapeSVG(s.id)).join("")}<div class="slot">?</div></div>`,
          prompt: "What comes next?", es: "¿Qué figura sigue?",
          speak: `${seq.slice(0, 4).map((s) => s.word).join(", ")}... What comes next?`,
          after: `${ans.word}!`, options: opts, answer: ans.id,
        };
      },
    });
  },

  memory() {
    $home.hidden = false; $title.textContent = "Memory"; $stars.hidden = true;
    const cards = shuffle(HELPERS.flatMap((h) => [{ id: h.id, pair: h.id, word: h.word }, { id: h.place, pair: h.id, word: place(h.place).word }]));
    $main.innerHTML = `
      <div class="prompt"><div class="prompt-text"><b>Find the pairs!</b><span>Une cada ayudante con su lugar de trabajo</span></div></div>
      <div class="stage"><div class="memory">
        ${cards.map((c, i) => `<button class="card" data-i="${i}" aria-label="Card ${i + 1}"><div class="in"><div class="f"><img src="${IMG.star}" alt=""></div><div class="b">${pic(c.id)}</div></div></button>`).join("")}
      </div></div>`;
    say("Find the pairs!");
    let open = [], found = 0, busy = false;
    $main.querySelectorAll(".card").forEach((el) => el.onclick = () => {
      const c = cards[+el.dataset.i];
      if (busy || el.classList.contains("open")) return;
      el.classList.add("open"); open.push(el); say(c.word, 0.8);
      if (open.length < 2) return;
      const [x, y] = open.map((e) => cards[+e.dataset.i]);
      busy = true;
      if (x.pair === y.pair) {
        setTimeout(() => {
          open.forEach((e) => e.classList.add("done")); ding(); cheer();
          const h = HELPERS.find((h) => h.id === x.pair);
          say(`Yes! The ${h.word.toLowerCase()} works at the ${place(h.place).word.toLowerCase()}!`);
          open = []; busy = false; found++;
          if (found === HELPERS.length) setTimeout(() => { score = 5; showEnd("Memory", GAMES.memory); }, 2600);
        }, 600);
      } else {
        setTimeout(() => { boop(); open.forEach((e) => e.classList.remove("open")); open = []; busy = false; }, 1300);
      }
    });
  },
};

showHome();
</script>

</body></html>
